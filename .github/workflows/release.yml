name: Release

run-name: Release ${{ inputs.type }}

on:
    workflow_dispatch:
        inputs:
            type:
                description: 'Version bump (pre* types use the beta preid)'
                type: choice
                options: [patch, minor, major, prepatch, preminor, premajor]
                default: patch

jobs:
    release:
        name: Release
        runs-on: ubuntu-latest
        if: ${{ github.repository == 'playcanvas/vscode-extension' && github.ref_name == 'main' }}
        # queue releases instead of racing them
        concurrency:
            group: release
            cancel-in-progress: false
        steps:
            # tags pushed with GITHUB_TOKEN don't trigger the publish workflow
            - name: Generate app token
              id: app-token
              uses: actions/create-github-app-token@v3
              with:
                  app-id: ${{ secrets.APP_ID }}
                  private-key: ${{ secrets.APP_KEY }}

            # latest main rather than the dispatch sha, so queued runs build on each other
            - name: Check out code
              uses: actions/checkout@v5
              with:
                  ref: main
                  fetch-depth: 0
                  token: ${{ steps.app-token.outputs.token }}

            - name: Set up Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 22.x

            - name: Configure git
              run: |
                  id=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)
                  git config user.name "${{ steps.app-token.outputs.app-slug }}[bot]"
                  git config user.email "${id}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"
              env:
                  GH_TOKEN: ${{ steps.app-token.outputs.token }}

            # bump from the base version: publish strips the prerelease suffix (the marketplace
            # has no semver prereleases), so every release needs its own X.Y.Z
            # (1.3.7-beta.0 -> patch -> 1.3.8, prepatch -> 1.3.8-beta.0)
            - name: Tag release
              run: |
                  current=$(npm pkg get version | tr -d '"')
                  npm version "${current%%-*}" --no-git-tag-version --allow-same-version > /dev/null
                  version=$(npm version "$TYPE" --preid=beta --no-git-tag-version)
                  git reset --hard HEAD
                  tag=$(npm version "$version")
                  git push --atomic origin HEAD:main "refs/tags/$tag"
                  echo "Released $tag" >> "$GITHUB_STEP_SUMMARY"
              env:
                  TYPE: ${{ inputs.type }}
