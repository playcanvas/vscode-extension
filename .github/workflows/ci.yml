name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    build:
        name: Build
        runs-on: ubuntu-latest
        steps:
            - name: Check out code
              uses: actions/checkout@v5

            - name: Set up Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 22.x
                  cache: 'npm'
                  registry-url: 'https://registry.npmjs.org/'

            - name: Install Dependencies
              run: npm ci

            - name: Install vsce
              run: npm install -g @vscode/vsce

            - name: Build PlayCanvas VS Code Extension
              run: npm run build

    lint:
        name: Lint
        runs-on: ubuntu-latest
        steps:
            - name: Check out code
              uses: actions/checkout@v5

            - name: Set up Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 22.x
                  cache: 'npm'
                  registry-url: 'https://registry.npmjs.org/'

            - name: Install Dependencies
              run: npm ci

            - name: Run ESLint
              run: npm run lint

    test:
        name: Test
        runs-on: ubuntu-latest
        steps:
            - name: Check out code
              uses: actions/checkout@v5

            - name: Set up Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 22.x
                  cache: 'npm'
                  registry-url: 'https://registry.npmjs.org/'

            - name: Install Dependencies
              run: npm ci

            - name: Install Xvfb
              run: sudo apt-get install -y xvfb

            # vscode-test falls back to a cached build when the update server is unreachable
            - name: Restore VS Code
              id: vscode-cache
              uses: actions/cache/restore@v6
              with:
                  path: .vscode-test/vscode-linux-x64-*
                  key: vscode-test-${{ runner.os }}
                  restore-keys: vscode-test-${{ runner.os }}-

            - name: Run Tests
              run: xvfb-run -a --server-args="-screen 0 1024x768x24" npm test

            # keep only the newest build so the cache doesn't grow with every release
            - name: Prune VS Code
              if: ${{ !cancelled() }}
              run: ls -d .vscode-test/vscode-linux-x64-* 2>/dev/null | sort -V | head -n -1 | xargs -r rm -rf

            - name: Save VS Code
              if: ${{ !cancelled() && hashFiles('.vscode-test/vscode-linux-x64-*/resources/app/package.json') != '' && steps.vscode-cache.outputs.cache-matched-key != format('vscode-test-{0}-{1}', runner.os, hashFiles('.vscode-test/vscode-linux-x64-*/resources/app/package.json')) }}
              uses: actions/cache/save@v6
              with:
                  path: .vscode-test/vscode-linux-x64-*
                  key: vscode-test-${{ runner.os }}-${{ hashFiles('.vscode-test/vscode-linux-x64-*/resources/app/package.json') }}
